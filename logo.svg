<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="hm-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#7a00e6" />
    </linearGradient>
  </defs>

  <!-- Left leg of H (Black) -->
  <rect x="110" y="90" width="18" height="120" fill="#111" />

  <!-- Right leg of H (Black) -->
  <rect x="185" y="90" width="18" height="120" fill="#111" />

  <!-- Purple/Black gradient Arch forming the crossbar of H and the M -->
  <path d="M 128 160 
           Q 180 120 235 175 
           L 285 90 
           L 285 210 
           L 267 210 
           L 267 145 
           L 235 200 
           Q 180 150 128 180 
           Z" fill="url(#hm-grad)" />

  <!-- Text HARSHA -->
  <text x="200" y="260" font-family="'Outfit', sans-serif" font-weight="900" font-size="52" fill="#111" text-anchor="middle" letter-spacing="8">HARSHA</text>

  <!-- Text MEDIA -->
  <line x1="60" y1="290" x2="110" y2="290" stroke="#7a00e6" stroke-width="2" />
  <text x="200" y="298" font-family="'Outfit', sans-serif" font-weight="700" font-size="28" fill="#7a00e6" text-anchor="middle" letter-spacing="12">MEDIA</text>
  <line x1="290" y1="290" x2="340" y2="290" stroke="#7a00e6" stroke-width="2" />

  <!-- Text CREATE CONNECT GROW -->
  <text x="200" y="330" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#333" text-anchor="middle" letter-spacing="6">CREATE <tspan fill="#7a00e6">•</tspan> CONNECT <tspan fill="#7a00e6">•</tspan> GROW</text>
</svg>
